<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        table {
            width: 600px;
            border-collapse: collapse;
        }

        td {
            text-align: center;
        }

         .detalhes{
            background-color: gray;
            color: white;
            font-weight: bolder;
            text-align: left;
        }

        th, td {
            padding: 10px;
            border: 1px solid black;
        }

        .destaque {
            background-color: gray;
            color: white;
            font-weight: bolder;
            
        }

        .normal {
            color: black;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col" rowspan="2" class="destaque">Área</th>
                <th scope="col" rowspan="2" class="destaque">Disciplina</th>
                <th scope="colgroup" colspan="2" class="destaque">Notas</th>
                <th scope="col" rowspan="2" class="destaque">Média</th>
            </tr>
            <tr>
            <th scope="col" class="destaque">Nota1</th>
            <th scope="col" class="destaque">Nota2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4" class="normal">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="row" colspan="4" class="detalhes">Média de Exatas</th>
                <th class="destaque">0.0</th>
            </tr>
            <tr>
                <th scope="rowgroup" rowspan="2" class="normal">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="row" colspan="4" class="detalhes">Média de Humanas</th>
                <th class="destaque">0.0</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
